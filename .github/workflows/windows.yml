name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version-file: course-worker/go.mod
          cache-dependency-path: course-worker/go.sum
      - name: Run Go tests
        working-directory: course-worker
        run: go test ./cmd/course-worker ./internal/course ./internal/courseflow ./internal/remindscraper
      - name: Set package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:\.\d+)?$') { throw 'Use a version tag such as v0.1.0.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "INSTALLER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/Build-Installer.ps1 -Version $env:INSTALLER_VERSION
      - name: Verify installer and uninstaller
        shell: pwsh
        run: |
          $exe = (Get-Item -LiteralPath "dist/windows-installer/BUCT-Course-Companion-$env:INSTALLER_VERSION-Setup-x64.exe").FullName
          $target = Join-Path $env:RUNNER_TEMP 'buct-installer-smoke'
          $log = Join-Path $env:RUNNER_TEMP 'buct-installer.log'
          $arguments = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"", "/LOG=`"$log`""
          $install = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 }
            throw "Setup returned $($install.ExitCode)."
          }
          foreach ($file in @('BuctCourseLocal.exe', 'course-worker.exe', 'WebView2Loader.dll', 'Assets\Ocr\chi_sim.traineddata')) {
            if (!(Test-Path -LiteralPath (Join-Path $target $file))) { throw "Missing installed file: $file" }
          }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall returned $($uninstall.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: dist/windows-installer/*-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-installer
          path: release-assets
      - name: Publish tagged installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release create "$GITHUB_REF_NAME" release-assets/*-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes; then exit 0; fi
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --clobber
