name: Linux macOS Android packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build:
        required: true
        type: string
    secrets:
      BUCT_ANDROID_KEYSTORE_B64:
        required: false
      BUCT_ANDROID_STORE_PASSWORD:
        required: false
      BUCT_ANDROID_KEY_PASSWORD:
        required: false
      BUCT_ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: linux-amd64
          - os: macos-15
            platform: macos
            artifact: macos-arm64
          - os: macos-15-intel
            platform: macos
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: course-worker/go.mod
          cache-dependency-path: course-worker/go.sum
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          required=(gcc libgl-dev libegl-dev libgl1-mesa-dri libx11-dev libxcursor-dev libxrandr-dev
            libxinerama-dev libxi-dev libxxf86vm-dev libxkbcommon-dev libwayland-dev xvfb xauth)
          missing=()
          for pkg in "${required[@]}"; do
            if ! dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null | grep -qx installed; then missing+=("$pkg"); fi
          done
          if ((${#missing[@]})); then
            if ! sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 "${missing[@]}"; then
              sudo apt-get update -o Acquire::Languages=none -o Acquire::Retries=2
              sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 "${missing[@]}"
            fi
          fi
      - name: Test Go modules
        working-directory: course-worker
        run: go test ./...
      - name: Build installer
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash packaging/portable/package-desktop.sh "$PLATFORM" "$VERSION"
      - name: Verify Linux install, launch and removal
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scratch=$(mktemp -d)
          installer="$PWD/dist/portable/BUCT-Course-Companion-$VERSION-linux-amd64.deb"
          dpkg-deb --field "$installer" Depends
          sudo apt-get install -y --no-install-recommends "$installer"
          test "$(dpkg-query -W -f='${Version}' buct-course-companion)" = "$VERSION"
          XDG_CONFIG_HOME="$scratch/config" LIBGL_ALWAYS_SOFTWARE=1 BUCT_PORTABLE_SMOKE=1 \
            timeout 30s xvfb-run -a /usr/bin/buct-course-companion | grep -F 'BUCT portable app opened'
          sudo apt-get remove -y buct-course-companion
          test ! -e /usr/bin/buct-course-companion
      - name: Verify macOS package and install it
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          arch=$(uname -m)
          sudo installer -pkg "dist/portable/BUCT-Course-Companion-$VERSION-macos-$arch.pkg" -target /
          app='/Applications/BUCT Course Companion.app'
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/buct-course-companion")" = "$arch"
          pkgutil --pkg-info io.github.ling0727ai.buctcoursecompanion | grep -Fx "version: $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact }}
          path: dist/portable/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: course-worker/go.mod
          cache-dependency-path: course-worker/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is required}}
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          go install fyne.io/tools/cmd/fyne@v1.7.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          tools="$RUNNER_TEMP/bundletool"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$tools/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $tools/bundletool.jar" | sha256sum --check
          cat > "$tools/bundletool" <<'EOF'
          #!/usr/bin/env bash
          exec java -jar "$(dirname -- "$0")/bundletool.jar" "$@"
          EOF
          chmod +x "$tools/bundletool"
          echo "$tools" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/buct-preview
          key: android-preview-key-buct-course-companion-v1
      - name: Build and verify APK
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          BUCT_ANDROID_KEYSTORE_B64: ${{ github.ref_type == 'tag' && secrets.BUCT_ANDROID_KEYSTORE_B64 || '' }}
          BUCT_ANDROID_STORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.BUCT_ANDROID_STORE_PASSWORD || '' }}
          BUCT_ANDROID_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.BUCT_ANDROID_KEY_PASSWORD || '' }}
          BUCT_ANDROID_KEY_ALIAS: ${{ github.ref_type == 'tag' && secrets.BUCT_ANDROID_KEY_ALIAS || '' }}
        run: bash packaging/portable/package-android.sh "$VERSION" "$BUILD"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-android-arm64
          path: dist/portable/*.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
